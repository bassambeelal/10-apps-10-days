<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo stage</title>
<style>
  @font-face { font-family: "DM Sans"; src: url("dm-sans.woff2") format("woff2"); font-weight: 100 1000; }
  :root { --bg: #0c0c0e; --ink: #ffffff; --accent: #e0669a; --accent-ink: #ffffff; --soft: rgba(255,255,255,0.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }

  /* full-screen type scenes */
  .card { position: absolute; inset: 0; display: grid; align-content: center; padding: 0 160px; opacity: 0; transition: opacity 280ms ease; pointer-events: none; }
  .card.on { opacity: 1; }
  .card.accent { background: var(--accent); color: var(--accent-ink); }
  .card.dark { background: var(--bg); }
  .card .kicker { font-size: 34px; font-weight: 600; letter-spacing: 0.01em; opacity: 0.8; margin-bottom: 28px; }
  .card .line { display: block; overflow: hidden; font-size: 128px; line-height: 1.02; font-weight: 800; letter-spacing: -0.045em; padding-bottom: 8px; }
  .card .line span { display: inline-block; transform: translateY(110%); transition: transform 620ms cubic-bezier(0.2, 0.9, 0.2, 1); }
  .card.on .line span { transform: none; }
  .card .line.big { font-size: 168px; }
  .card .line.mid { font-size: 96px; }
  .card .line .hl { color: var(--accent); }
  .card.accent .line .hl { color: var(--accent-ink); text-decoration: underline; text-decoration-thickness: 10px; text-underline-offset: 14px; }
  .card .src { margin-top: 36px; font-size: 26px; opacity: 0.7; }
  .card .logo { width: 132px; height: 132px; margin-bottom: 36px; border-radius: 30px; transform: scale(0.6); opacity: 0; transition: transform 700ms cubic-bezier(0.2, 1.4, 0.3, 1), opacity 300ms ease; }
  .card.on .logo { transform: none; opacity: 1; }
  .card .url { margin-top: 44px; display: inline-flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 600; padding: 18px 30px; border-radius: 999px; background: rgba(255,255,255,0.1); width: max-content; }
  .card.accent .url { background: rgba(0,0,0,0.18); }
  .card .badges { display: flex; gap: 14px; margin-top: 36px; }
  .card .logos { display: flex; gap: 44px; margin-top: 56px; }
  .card .logos figure { margin: 0; display: grid; justify-items: center; gap: 18px; width: 220px; opacity: 0; transform: translateY(30px) scale(0.85); transition: opacity 400ms ease, transform 650ms cubic-bezier(0.2, 1.3, 0.3, 1); }
  .card.on .logos figure { opacity: 1; transform: none; }
  .card .logos img { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 18px 50px rgba(0,0,0,0.45); }
  .card .logos figcaption { font-size: 28px; font-weight: 700; text-align: center; line-height: 1.15; }
  .card .badges span { font-size: 30px; font-weight: 600; padding: 12px 24px; border-radius: 999px; border: 2px solid currentColor; opacity: 0; transform: translateY(16px); transition: opacity 400ms ease, transform 500ms cubic-bezier(0.2, 0.9, 0.2, 1); }
  .card.on .badges span { opacity: 1; transform: none; }

  /* the device with the real app inside */
  #world { position: absolute; inset: 0; opacity: 0; transition: opacity 320ms ease; }
  #world.on { opacity: 1; }
  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transition: transform 1100ms cubic-bezier(0.65, 0, 0.25, 1); }
  .device { position: absolute; background: #1b1b1f; overflow: hidden; }
  .device.browser { left: 150px; top: 70px; width: 1620px; height: 940px; border-radius: 18px; box-shadow: 0 40px 120px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08); }
  .device.browser .bar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #232328; }
  .device.browser .bar i { width: 13px; height: 13px; border-radius: 50%; background: #4a4a50; display: block; }
  .device.browser .bar i:nth-child(1) { background: #ff5f57; } .device.browser .bar i:nth-child(2) { background: #febc2e; } .device.browser .bar i:nth-child(3) { background: #28c840; }
  .device.browser .addr { margin-left: 18px; flex: 1; height: 32px; border-radius: 8px; background: #2f2f35; color: #c8c8cc; font-size: 16px; display: flex; align-items: center; padding: 0 14px; }
  .device.browser iframe { position: absolute; left: 0; top: 52px; width: 1440px; height: 888px; border: 0; transform-origin: 0 0; transform: scale(1.125); background: #fff; }
  .device.phone { left: 735px; top: 40px; width: 450px; height: 1000px; border-radius: 64px; padding: 16px; background: #111114; box-shadow: 0 40px 120px rgba(0,0,0,0.55), inset 0 0 0 3px #2c2c31; }
  .device.phone iframe { width: 390px; height: 844px; border: 0; border-radius: 40px; transform-origin: 0 0; transform: scale(1.0513); background: #fff; display: block; }
  .device.phone .bar { display: none; }

  /* big type beside the phone */
  #side { position: absolute; left: 980px; top: 0; bottom: 0; width: 820px; display: grid; align-content: center; pointer-events: none; }
  #side .kicker { font-size: 30px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; opacity: 0; transition: opacity 300ms ease; }
  #side.on .kicker { opacity: 1; }
  #side .line { display: block; overflow: hidden; font-size: 104px; line-height: 1.04; font-weight: 800; letter-spacing: -0.04em; padding-bottom: 6px; }
  #side .line span { display: inline-block; transform: translateY(110%); transition: transform 600ms cubic-bezier(0.2, 0.9, 0.2, 1); }
  #side.on .line span { transform: none; }
  #side .line .hl { color: var(--accent); }
  #side .sub { margin-top: 28px; font-size: 32px; line-height: 1.35; color: var(--soft); max-width: 700px; opacity: 0; transform: translateY(12px); transition: opacity 400ms ease 350ms, transform 500ms ease 350ms; }
  #side.on .sub { opacity: 1; transform: none; }
  #side.out { transition: opacity 200ms ease; opacity: 0; }
  #stage.zoomed #side { opacity: 0; transition: opacity 250ms ease; }

  /* cursor */
  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 30; transform: translate(1980px, 900px); transition: transform 700ms cubic-bezier(0.45, 0, 0.2, 1); pointer-events: none; }
  #cursor svg { width: 34px; height: 34px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45)); transition: transform 120ms ease; }
  #cursor.down svg { transform: scale(0.82); }
  .ripple { position: absolute; z-index: 29; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 4px solid var(--accent); animation: ripple 600ms ease-out forwards; pointer-events: none; }
  @keyframes ripple { from { transform: scale(0.4); opacity: 1; } to { transform: scale(3.6); opacity: 0; } }

  /* captions */
  #caption { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(16px); z-index: 40; max-width: 1500px; padding: 18px 32px; border-radius: 22px; background: rgba(10, 10, 12, 0.86); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 12px 40px rgba(0, 0, 0, 0.35); color: #fff; font-size: 40px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; text-align: center; opacity: 0; transition: opacity 220ms ease, transform 320ms cubic-bezier(0.2, 0.9, 0.2, 1); }
  #caption.on { opacity: 1; transform: translateX(-50%); }
  #caption b { color: var(--accent); font-weight: 800; }
  #stage.phone-side #caption { left: 1390px; max-width: 820px; }

  /* corner bug */
  #bug { position: absolute; left: 40px; top: 30px; z-index: 35; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; opacity: 0; transition: opacity 300ms ease; }
  #bug.on { opacity: 1; }
  #stage.zoomed #bug { opacity: 0; }
  #bug img { width: 44px; height: 44px; border-radius: 11px; }
  #bug span { font-weight: 500; opacity: 0.6; }
  #progress { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--accent); z-index: 41; }

  /* flash between scenes, on the beat */
  #flash { position: absolute; inset: 0; background: var(--accent); z-index: 50; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash 360ms ease-out; }
  @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <div id="world"><div id="cam"><div class="device browser" id="device"><div class="bar"><i></i><i></i><i></i><div class="addr" id="addr"></div></div><iframe id="app" title="App"></iframe></div></div><div id="side"></div></div>
  <div id="cards"></div>
  <div id="bug"><img id="bug-logo" alt=""><div id="bug-text"></div></div>
  <div id="cursor"><svg viewBox="0 0 24 24"><path d="M4 2l15 11.5-6.4.9 3.7 7.3-2.9 1.4-3.6-7.4L4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
  <div id="caption"></div>
  <div id="progress"></div>
  <div id="flash"></div>
</div>
<script src="stage.js"></script>
</body>
</html>
