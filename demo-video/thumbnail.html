<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail</title>
<style>
  @font-face { font-family: "DM Sans"; src: url("dm-sans.woff2") format("woff2"); font-weight: 100 1000; }
  :root { --bg: #0d0f14; --ink: #ffffff; --accent: #7c5cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  .t { position: relative; width: 1280px; height: 720px; overflow: hidden; color: var(--ink); font-family: "DM Sans", system-ui, sans-serif;
       background: radial-gradient(900px 600px at 85% 50%, rgba(124, 92, 255, 0.45), transparent 70%), var(--bg); }
  .copy { position: absolute; left: 64px; top: 70px; }
  .copy .big { display: block; font-size: 190px; line-height: 0.9; font-weight: 900; letter-spacing: -0.055em; }
  .copy .big em { font-style: normal; color: var(--accent); }
  .copy .tag { display: inline-block; margin-top: 34px; font-size: 44px; font-weight: 800; letter-spacing: -0.02em; background: #ffffff; color: #0d0f14; padding: 10px 24px; border-radius: 16px; transform: rotate(-2deg); }
  .grid { position: absolute; right: 70px; top: 50%; width: 400px; display: grid; grid-template-columns: repeat(2, 180px); gap: 24px 40px; justify-content: center; transform: translateY(-50%) rotate(4deg); }
  .grid img { width: 180px; height: 180px; border-radius: 42px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 255, 255, 0.12); display: block; }
  .grid img:nth-child(5) { grid-column: 1 / span 2; justify-self: center; }
  .free { position: absolute; left: 64px; bottom: 54px; font-size: 34px; font-weight: 700; opacity: 0.85; }
</style>
</head>
<body>
<div class="t">
  <div class="copy">
    <span class="big">10 APPS</span>
    <span class="big"><em>10 DAYS</em></span>
    <span class="tag">5 free web apps</span>
  </div>
  <div class="grid">
    <img src="../day-01-fair-split/app/icons/icon-512.png" alt="">
    <img src="../day-03-citation-check/app/icons/icon-512.png" alt="">
    <img src="../day-05-hidden-text-finder/app/icons/icon-512.png" alt="">
    <img src="../day-07-qr-check/app/icons/icon-512.png" alt="">
    <img src="../day-09-memories-fixer/app/icons/icon-512.png" alt="">
  </div>
  <div class="free">No sign-up. Real problems.</div>
</div>
</body>
</html>
