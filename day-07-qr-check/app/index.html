<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Check</title>
  <meta name="description" content="Scan the QR codes on your menus, flyers and signs, see whether a link service controls where they go, keep a list, and make direct codes that never expire.">
  <meta name="theme-color" content="#fbf7f8">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script>try { var t = localStorage.getItem('qrc:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <header class="phone-bar" id="phone-bar"></header>
    <main id="main" tabindex="-1"><noscript><p style="padding:24px">QR Check needs JavaScript to read and make codes.</p></noscript></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="print-sheet" aria-hidden="true"></div>
  <input type="file" id="photo" accept="image/*" hidden>
  <script src="vendor/jsQR.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="qr-core.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
