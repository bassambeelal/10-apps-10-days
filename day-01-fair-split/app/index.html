<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fair Split</title>
  <meta name="description" content="A shared expense book for flats, trips and groups. No sign-up, no daily limit, nothing on a server. Every balance shows its working, and it finds the fewest payments to settle up.">
  <meta name="theme-color" content="#f2f4f7">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script>
    // Set the theme before the first paint, so a dark-mode choice never flashes white.
    try { var t = JSON.parse(localStorage.getItem('fs:prefs') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body class="no-tabs">
  <a class="skip" href="#main" onclick="document.getElementById('main').focus(); return false;">Skip to content</a>
  <header class="bar" id="bar"><div class="bar-in"><span class="brand">Fair Split</span></div></header>
  <main id="main" tabindex="-1">
    <noscript><p>Fair Split needs JavaScript to run. Turn it on, or open the page in a current browser.</p></noscript>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Book" hidden></nav>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="sheet" id="sheet"></dialog>
  <script src="core.js"></script>
  <script src="icons.js"></script>
  <script src="sample.js"></script>
  <script src="app.js"></script>
</body>
</html>
